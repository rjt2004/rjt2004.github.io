# 音乐播放器
music_player:
  enable: true
  playlist_id: "2913335699"   # 网易云歌单ID
  proxy: "https://myblog-music.1610773590.workers.dev"   # 网易云代理 Worker 地址
  br: 128000                  # 音质：128000 / 320000

social_contact:
  enable: true      # Option values: true | false
  links:
    github:  https://github.com/rjt2004        # GitHub
    email:  1610773590@qq.com         # Email
    weixin:                                          # WeChat
    qq:   img | /images/qq.jpg           # QQ
    weibo:   # WeiBo
    zhihu:           # ZhiHu
    twitter:         # Twitter
    x:               # X
    facebook:        # Facebook
    
    bilibili:  https://space.bilibili.com/62971110

scroll:
  hide_header: true

home:
  announcement:
  post_excerpt: false
  category: false        # Option values: true | false
  tag: false               # Option values: true | false
  post_datetime: updated    # Option values: updated | created
  post_datetime_format: YYYY-MM-DD # Option values: ago | YYYY-MM-DD HH:mm:ss

  weather:
    enable: true
    provider: qweather
    # 首页天气请求地址。和风天气 JWT 私钥保存在 Cloudflare Worker，不写入博客源码。
    endpoint: https://myblog-weather.1610773590.workers.dev/weather
    # location 和 adm 会发送给 Worker 查询天气；display_place 只用于首页展示。
    location: 上海奉贤
    adm: 上海
    display_place: 上海市奉贤区
    refresh_minutes: 10

post:
  img_align: center      # Option values: left | center | right

  author_badge:
    enable: false         # Option values: true | false
    level_badge: false    # Option values: true | false
    custom_badge: ["One", "Two", "Three"]

  word_count:
    wordcount: true    # Word count, one article. Option values: true | false
    min2read: true    # Time to read, one article. Option values: true | false

  datetime_format: "YYYY-MM-DD"  # Datetime format. e.g. "YYYY-MM-DD HH:mm:ss"

  copyright_info: false  # Option values: true | false

  share: true         # Option values: true | false

  reward:
    enable: false        # Option values: true | false
    img_link:            # Image link for the payment QR code
    text:                # Custom reward text, Can be null


code_block:
  tools:
    enable: true           # Option values: true | false
    style: default            # Option values: default | mac
  highlight_theme: default    # Option values: default | obsidian

toc:
  enable: true     # Option values: true | false
  number: true      # Option values: true | false
  expand_all: true  # Option values: true | false
  init_open: true    # Option values: true | false
  layout: left      # Option values: left | right

website_count:
  busuanzi_count:
    enable: true     # Option values: true | false
    site_uv: true   # Option values: true | false
    site_pv: true    # Option values: true | false
    page_pv: true   # Option values: true | false

local_search:
  enable: false      # Option values: true | false
  preload: true    # Preload the search data when the page loads

pjax:
  enable: true   # Option values: true | false

footer:
  since: 2024            # The starting year of your website, Can be null
  word_count: false      # Option values: true | false

  record:
   enable: false


comment:
  enable: true
  use: giscus

  giscus:
    repo: rjt2004/rjt2004.github.io
    repo_id: R_kgDOM__o0Q
    category: Announcements
    category_id: DIC_kwDOM__o0c4C-z_p
    reactions_enabled: true

lazyload:
  enable: true  # Option values: true | false












